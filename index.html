<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Pikachu 16x9</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e6f2ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #337ab7;
            margin: 5px 0 15px 0;
        }

        #khung {
            display: inline-block;
            background-color: #ffffff;
            padding: 15px 20px;
            border: 2px solid #ccc;
            border-radius: 6px;
        }

        .control-level {
            margin-bottom: 15px;
        }

        .control-level label {
            font-weight: bold;
            color: #333;
        }

        .control-level select {
            padding: 6px 10px;
            font-size: 14px;
            margin: 0 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        .control-level button {
            padding: 6px 12px;
            font-size: 14px;
            margin: 0 3px;
            color: white;
            background-color: #f0ad4e;
            border: 1px solid #eea236;
            border-radius: 4px;
            cursor: pointer;
        }

        .control-level button:hover {
            background-color: #ec971f;
        }

        #info {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }

        #remain {
            font-weight: bold;
            color: #337ab7;
        }

        #timer {
            display: inline-block;
            font-size: 20px;
            font-weight: bold;
            color: #3c763d;
            background-color: #dff0d8;
            border: 1px solid #d6e9c6;
            border-radius: 4px;
            margin: 10px auto;
            padding: 6px 15px;
        }

        #timer.sapHetGio {
            color: #a94442;
            background-color: #f2dede;
            border: 1px solid #ebccd1;
        }

        .control-game {
            margin: 10px 0 15px 0;
        }

        .control-game button {
            padding: 6px 12px;
            margin: 0 3px;
            font-size: 14px;
            color: white;
            background-color: #337ab7;
            border: 1px solid #2e6da4;
            border-radius: 4px;
            cursor: pointer;
        }

        .control-game button:hover {
            background-color: #286090;
        }

        #pauseBtn {
            background-color: #5bc0de;
            border: 1px solid #46b8da;
        }

        #pauseBtn:hover {
            background-color: #31b0d5;
        }

        #game {
            margin: 10px auto;
            border-collapse: separate;
            border-spacing: 2px;
            background-color: #f5f5f5;
            border: 2px solid #ccc;
            border-radius: 6px;
        }

        .cell {
            width: 40px;
            height: 40px;
            text-align: center;
            vertical-align: middle;
            font-size: 22px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        .cell:hover {
            background-color: #ffffcc;
        }

        .cell.selected {
            background-color: #ffeb3b;
            border: 2px solid #f57c00;
        }

        .cell.covered {
            background-color: #777777;
            color: white;
            font-weight: bold;
            user-select: none;
        }

        .cell.covered:hover {
            background-color: #555555;
        }

        .cell.flipped {
            background-color: #d9edf7;
            border: 2px solid #31708f;
        }

        .cell.empty {
            background-color: #f5f5f5;
            border: 1px solid #f5f5f5;
            cursor: default;
        }

        .cell.obstacle {
            background-color: #333333;
            color: white;
            cursor: not-allowed;
            border: 1px solid #111111;
        }
    </style>

</head>
<body>

<div id="khung">
    <h1>Game Pikachu 16x9</h1>
    <div class="control-level">
        <div id="huongDan">
        </div>
        <label for="level-select">Màn chơi :</label>
        <select id="level-select" onchange="doiManChoi(this.value)">
            <option value="1">Màn 1</option>
            <option value="2">Màn 2</option>
            <option value="3">Màn 3</option>
            <option value="4">Màn 4</option>
        </select>
        <button onclick="choiLai()">Chơi lại !</button>
    </div>
    <div id="info">Thẻ còn lại: <span id="remain">144</span></div>
    <div id="timer">Thời gian: 4:00</div>
    <div class="control-game">
        <button onclick="goiY()">Gợi ý ô (<span id="hintCount">3</span>)</button>
        <button onclick="xaoTron()">Xáo trộn (<span id="shuffleCount">3</span>)</button>
        <button id="pauseBtn" onclick="tamDung()">Tạm dừng</button>
    </div>
    <table id="game"></table>
</div>

<script src="game.js"></script>
</body>
</html>
