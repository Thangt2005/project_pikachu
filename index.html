<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Pikachu 16x9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Game Pikachu 16x9</h1>
<div class="control-level">
    <label for="level-select">Màn chơi :</label>
    <select id="level-select" onchange="doiManChoi(this.value)">
        <option value="1">Màn 1</option>
        <option value="2">Màn 2</option>
        <option value="3">Màn 3</option>
        <option value="4">Màn 4</option>
        <option value="5">Màn 5</option>
    </select>
    <button onclick="choiLai()">Chơi lại !</button>
</div>
<div>Thẻ còn lại: <span id="remain">144</span></div>

<table id="game" border="1"></table>

<script src="game.js"></script>
</body>
</html>
